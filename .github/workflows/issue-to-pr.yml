name: Issue to PR (Codex)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    name: Codex Implementation
    runs-on: ubuntu-latest
    if: github.event.label.name == 'agent-task'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create branch
        id: branch
        run: |
          BRANCH="agent/${{ github.event.issue.number }}-$(echo '${{ github.event.issue.title }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | head -c 40)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Read CLAUDE.md
        id: context
        run: |
          CONTEXT=$(cat CLAUDE.md | head -100)
          echo "context<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Codex Implementation
        uses: openai/codex-action@v1
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are implementing a feature for zkTalk, a community messenger.

            Project context:
            ${{ steps.context.outputs.context }}

            Task from issue #${{ github.event.issue.number }}:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

            Requirements:
            - Follow the module pattern in CLAUDE.md
            - Include Zod schemas, types, routes, services, repositories
            - Write tests for all new code
            - Use @zktalk/shared for shared types

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: implement #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          git push -u origin ${{ steps.branch.outputs.branch }}

      - name: Create PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `feat: ${context.payload.issue.title}`,
              body: `## Summary\nAutomatic implementation for #${context.payload.issue.number}\n\n## Issue\nCloses #${context.payload.issue.number}\n\n---\n🤖 Generated by Codex Agent`,
              head: '${{ steps.branch.outputs.branch }}',
              base: 'main'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `🤖 Implementation PR created: #${pr.number}`
            });
