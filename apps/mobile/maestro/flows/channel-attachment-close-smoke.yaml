appId: com.zktalk.mobile
env:
  FLOW_WAIT_TIMEOUT_MS: 20000
---
- extendedWaitUntil:
    visible:
      id: attachment-lightbox
    timeout: ${FLOW_WAIT_TIMEOUT_MS}
- tapOn:
    id: attachment-lightbox
    point: "92%,8%"
- extendedWaitUntil:
    notVisible:
      id: attachment-lightbox
    timeout: ${FLOW_WAIT_TIMEOUT_MS}
- assertNotVisible:
    id: attachment-lightbox
