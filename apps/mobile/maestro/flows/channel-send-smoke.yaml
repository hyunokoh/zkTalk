appId: com.zktalk.mobile
env:
  FLOW_WAIT_TIMEOUT_MS: 20000
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "# ${CHANNEL_NAME}"
    timeout: ${FLOW_WAIT_TIMEOUT_MS}
- assertVisible: "# ${CHANNEL_NAME}"
- tapOn:
    id: message-composer-input
- inputText: ${MESSAGE_BODY}
- tapOn:
    id: message-composer-send
- extendedWaitUntil:
    visible:
      id: channel-message-list
    timeout: ${FLOW_WAIT_TIMEOUT_MS}
